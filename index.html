<!DOCTYPE html>
<html lang="es" data-theme="ipod">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio єѕρєηcαт</title>
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/pakito71/Logos/refs/heads/master/Lobo-auriculares.jpg">
    <style>
        /* =========================================================
           DEFINICIÓN DE TEMAS (iPod Classic por defecto, M3 y VLC)
           ========================================================= */
        :root,
        [data-theme="ipod"] {
            --bg-app: #d1d5db;
            --bg-surface: linear-gradient(180deg, #f9fafb 0%, #e5e7eb 100%);
            --bg-deck: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            --bg-card: #ffffff;
            --bg-card-hover: #f0f9ff;
            --bg-card-active: #dbeafe;
            --text-main: #111827;
            --text-muted: #4b5563;
            --accent: #2563eb;
            --accent-text: #ffffff;
            --border-color: #9ca3af;
            --deck-border: #60a5fa;
            --radius-main: 24px;
            --radius-card: 12px;
            --btn-radius: 50%;
            --shadow-main: 0 12px 30px rgba(0, 0, 0, 0.25), inset 0 2px 3px rgba(255, 255, 255, 0.9);
            --eq-color: #1d4ed8;
            --font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        }

        [data-theme="m3-lavender"] {
            --bg-app: #f4eff4;
            --bg-surface: #fffbfe;
            --bg-deck: #f3edf7;
            --bg-card: #f7f2fa;
            --bg-card-hover: #ece6f0;
            --bg-card-active: #e8def8;
            --text-main: #1d1b20;
            --text-muted: #49454f;
            --accent: #6750a4;
            --accent-text: #ffffff;
            --border-color: #cac4d0;
            --deck-border: #d0bcff;
            --radius-main: 28px;
            --radius-card: 18px;
            --btn-radius: 16px;
            --shadow-main: 0 8px 24px rgba(103, 80, 164, 0.12);
            --eq-color: #6750a4;
            --font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        [data-theme="m3-dark"] {
            --bg-app: #141218;
            --bg-surface: #1d1b20;
            --bg-deck: #2b2930;
            --bg-card: #211f26;
            --bg-card-hover: #2b2930;
            --bg-card-active: #4f378b;
            --text-main: #e6e0e9;
            --text-muted: #cac4d0;
            --accent: #d0bcff;
            --accent-text: #381e72;
            --border-color: #49454f;
            --deck-border: #6750a4;
            --radius-main: 28px;
            --radius-card: 18px;
            --btn-radius: 16px;
            --shadow-main: 0 10px 28px rgba(0, 0, 0, 0.5);
            --eq-color: #d0bcff;
            --font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        [data-theme="vlc"] {
            --bg-app: #1e1e1e;
            --bg-surface: #2d2d2d;
            --bg-deck: #1a1a1a;
            --bg-card: #383838;
            --bg-card-hover: #454545;
            --bg-card-active: #4d3319;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #ff8800;
            --accent-text: #111111;
            --border-color: #4b5563;
            --deck-border: #ff8800;
            --radius-main: 12px;
            --radius-card: 8px;
            --btn-radius: 8px;
            --shadow-main: 0 10px 25px rgba(0, 0, 0, 0.6);
            --eq-color: #ff8800;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .app-shell {
            background: var(--bg-surface);
            width: 100%;
            max-width: 920px;
            height: 100%;
            max-height: 860px;
            border-radius: var(--radius-main);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* =========================================================
           CABECERA FIJA
           ========================================================= */
        .top-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
        }

        .brand h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--text-main);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--bg-card-hover);
            transform: scale(1.05);
        }

        /* =========================================================
           REPRODUCTOR COMPACTO FIJO SUPERIOR
           ========================================================= */
        .player-deck {
            flex-shrink: 0;
            background: var(--bg-deck);
            margin: 10px 16px 6px 16px;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--deck-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .deck-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .current-logo {
            width: 58px;
            height: 58px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            height: 26px;
            gap: 4px;
        }

        .eq-bar {
            width: 4px;
            height: 5px;
            background-color: var(--eq-color);
            border-radius: 2px;
            transition: height 0.2s ease;
        }

        .playing .eq-bar {
            animation: eqBounce 0.7s infinite ease-in-out alternate;
        }

        .playing .eq-bar:nth-child(2) { animation-delay: 0.15s; }
        .playing .eq-bar:nth-child(3) { animation-delay: 0.35s; }
        .playing .eq-bar:nth-child(4) { animation-delay: 0.1s; }
        .playing .eq-bar:nth-child(5) { animation-delay: 0.25s; }

        @keyframes eqBounce {
            0% { height: 5px; }
            100% { height: 26px; }
        }

        .current-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-title:empty {
            display: none;
        }

        /* Fila de controles: Anterior + Play/Pausa + Siguiente + Volumen */
        .deck-controls {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .playback-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-img-control {
            width: 44px;
            height: 44px;
            padding: 0;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }

        .btn-img-control img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            display: block;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.25));
        }

        .btn-img-control:hover {
            transform: scale(1.08);
        }

        .btn-img-control:active {
            transform: scale(0.95);
        }

        .btn-play-img {
            width: 48px;
            height: 48px;
        }

        .volume-box {
            flex: 1;
            min-width: 130px;
            max-width: 320px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            font-size: 0.95rem;
            user-select: none;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
            height: 6px;
        }

        /* =========================================================
           BARRA DE FILTROS POR TIPO DE EMISORA
           ========================================================= */
        .filter-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px 8px 16px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
        }

        .filter-bar::-webkit-scrollbar {
            height: 4px;
        }

        .filter-bar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .filter-chip {
            flex-shrink: 0;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 6px 13px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
        }

        .filter-chip:hover {
            background: var(--bg-card-hover);
        }

        .filter-chip.active {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        /* =========================================================
           CONTENEDOR CON SCROLL SOLO PARA LAS EMISORAS
           ========================================================= */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px 16px 18px 16px;
        }

        .scroll-area::-webkit-scrollbar {
            width: 7px;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        /* Cuadrícula fluida: siempre mínimo 2 emisoras por fila */
        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(125px, calc(50% - 6px)), 1fr));
            gap: 12px;
            width: 100%;
        }

        .station-card {
            min-width: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .station-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .station-card.active {
            background: var(--bg-card-active);
            border: 2px solid var(--accent);
        }

        .station-logo {
            width: min(72px, 65%);
            aspect-ratio: 1 / 1;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 8px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
        }

        .station-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            width: 100%;
            word-break: break-word;
        }

        .station-badge {
            margin-top: 5px;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 2px 8px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 28px 12px;
            font-size: 0.9rem;
        }

        /* =========================================================
           VISTA SECUNDARIA: AÑADIR EMISORA
           ========================================================= */
        .view-hidden {
            display: none !important;
        }

        .add-view {
            flex: 1;
            overflow-y: auto;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .add-view h2 {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .field-group input,
        .field-group select {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-primary,
        .btn-secondary {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="app-shell">
    <!-- Cabecera fija -->
    <header class="top-bar">
        <div class="brand">
            <img class="brand-logo" src="https://raw.githubusercontent.com/pakito71/Logos/refs/heads/master/Lobo-auriculares.jpg" alt="Logo Radio">
            <h1>Radio єѕρєηcαт</h1>
        </div>
        <div class="top-actions">
            <button class="icon-btn" id="themeBtn" title="Cambiar tema">🎨</button>
            <button class="icon-btn" id="toggleViewBtn" title="Añadir emisora">➕</button>
        </div>
    </header>

    <!-- Vista principal: Reproductor fijo arriba + Filtros + Cuadrícula con scroll -->
    <div id="mainView" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <section class="player-deck" id="playerDeck">
            <div class="deck-visual">
                <img id="currentLogo" class="current-logo" src="https://raw.githubusercontent.com/pakito71/Logos/refs/heads/master/Lobo-auriculares.jpg" alt="Logo emisora">
                <div class="equalizer" aria-hidden="true">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
            </div>

            <div class="current-title" id="currentTitle"></div>

            <div class="deck-controls">
                <div class="playback-buttons">
                    <button class="btn-img-control" id="prevStationBtn" title="Emisora anterior" aria-label="Emisora anterior">
                        <img src="https://raw.githubusercontent.com/pakito71/Logos/refs/heads/master/Boton_Anterior.png" alt="Anterior">
                    </button>
                    <button class="btn-img-control btn-play-img" id="playPauseBtn" title="Reproducir / Pausar" aria-label="Reproducir o Pausar">
                        <img id="playPauseImg" src="https://raw.githubusercontent.com/pakito71/Logos/refs/heads/master/Boton_Play.png" alt="Reproducir">
                    </button>
                    <button class="btn-img-control" id="nextStationBtn" title="Siguiente emisora" aria-label="Siguiente emisora">
                        <img src="https://raw.githubusercontent.com/pakito71/Logos/refs/heads/master/Boton_Siguiente.png" alt="Siguiente">
                    </button>
                </div>
                <div class="volume-box">
                    <span class="volume-icon" id="volIcon">🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="0.8" aria-label="Volumen">
                </div>
            </div>
        </section>

        <!-- Barra de filtros por tipo -->
        <nav class="filter-bar" id="filterBar" aria-label="Filtrar por tipo de emisora"></nav>

        <main class="scroll-area">
            <div class="station-grid" id="stationGrid"></div>
        </main>
    </div>

    <!-- Vista secundaria: Formulario para añadir emisoras -->
    <section id="addView" class="add-view view-hidden">
        <h2>➕ Añadir nueva emisora</h2>
        <div class="field-group">
            <label for="newName">Nombre de la emisora *</label>
            <input type="text" id="newName" placeholder="Ej. Mi Radio Favorita">
        </div>
        <div class="field-group">
            <label for="newType">Tipo de emisora *</label>
            <select id="newType">
                <option value="Música">Música</option>
                <option value="Deportes">Deportes</option>
                <option value="Nacional">Nacional</option>
                <option value="Local">Local</option>
            </select>
        </div>
        <div class="field-group">
            <label for="newLogo">URL del logo (opcional)</label>
            <input type="url" id="newLogo" placeholder="https://ejemplo.com/logo.png">
        </div>
        <div class="field-group">
            <label for="newUrl1">URL principal del stream *</label>
            <input type="url" id="newUrl1" placeholder="https://ejemplo.com/stream.mp3">
        </div>
        <div class="field-group">
            <label for="newUrl2">URL alternativa de respaldo (opcional)</label>
            <input type="url" id="newUrl2" placeholder="https://respaldo.com/stream.mp3">
        </div>
        <div class="form-buttons">
            <button class="btn-secondary" id="cancelAddBtn">Cancelar</button>
            <button class="btn-primary" id="saveStationBtn">Guardar emisora</button>
        </div>
    </section>
</div>

<audio id="audioPlayer" crossorigin="anonymous"></audio>

    ];

    /* Temas disponibles (iPod Classic por defecto) */
    const themes = ["ipod", "m3-lavender", "m3-dark", "vlc"];
    let currentThemeIndex = themes.indexOf(localStorage.getItem("radioTheme"));
    if (currentThemeIndex === -1) currentThemeIndex = 0;

    function applyTheme(index) {
        document.documentElement.setAttribute("data-theme", themes[index]);
        localStorage.setItem("radioTheme", themes[index]);
    }
    applyTheme(currentThemeIndex);

    /* Estado de emisoras y reproducción */
    const DEFAULT_TYPE_MAP = Object.fromEntries(defaultStations.map(st => [st.name, st.type]));
    let savedStations = JSON.parse(localStorage.getItem("espencatStations"));
    let stations = (savedStations || defaultStations).map(st => ({
        ...st,
        type: VALID_TYPES.includes(st.type) ? st.type : (DEFAULT_TYPE_MAP[st.name] || "Música")
    }));

    let selectedType = "Todas";
    let currentStationIndex = -1;
    let currentUrlIndex = 0;
    let isPlaying = false;

    const audio = document.getElementById("audioPlayer");
    const playerDeck = document.getElementById("playerDeck");
    const currentLogoEl = document.getElementById("currentLogo");
    const currentTitleEl = document.getElementById("currentTitle");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const playPauseImg = document.getElementById("playPauseImg");
    const prevStationBtn = document.getElementById("prevStationBtn");
    const nextStationBtn = document.getElementById("nextStationBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const volIcon = document.getElementById("volIcon");
    const filterBar = document.getElementById("filterBar");
    const stationGrid = document.getElementById("stationGrid");
    const mainView = document.getElementById("mainView");
    const addView = document.getElementById("addView");
    const toggleViewBtn = document.getElementById("toggleViewBtn");

    function updatePlayPauseIcon(playing) {
        if (playing) {
            playPauseImg.src = PAUSE_ICON_URL;
            playPauseImg.alt = "Pausar";
        } else {
            playPauseImg.src = PLAY_ICON_URL;
            playPauseImg.alt = "Reproducir";
        }
    }

    function getFilteredStationIndices() {
        const result = [];
        stations.forEach((st, idx) => {
            if (selectedType === "Todas" || st.type === selectedType) {
                result.push(idx);
            }
        });
        return result;
    }

    function renderFilters() {
        filterBar.innerHTML = "";
        STATION_TYPES.forEach((type) => {
            const count = type === "Todas"
                ? stations.length
                : stations.filter(st => st.type === type).length;

            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "filter-chip" + (selectedType === type ? " active" : "");
            chip.textContent = `${type} (${count})`;
            chip.addEventListener("click", () => {
                selectedType = type;
                renderFilters();
                renderGrid();
            });
            filterBar.appendChild(chip);
        });
    }

    function renderGrid() {
        stationGrid.innerHTML = "";
        const visibleIndices = getFilteredStationIndices();

        if (visibleIndices.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-state";
            empty.textContent = `No hay emisoras guardadas en "${selectedType}".`;
            stationGrid.appendChild(empty);
            return;
        }

        visibleIndices.forEach((idx) => {
            const station = stations[idx];
            const card = document.createElement("div");
            card.className = "station-card" + (idx === currentStationIndex ? " active" : "");

            const img = document.createElement("img");
            img.className = "station-logo";
            img.src = station.logo || DEFAULT_LOGO;
            img.alt = station.name;
            img.onerror = () => { img.src = DEFAULT_LOGO; };

            const title = document.createElement("div");
            title.className = "station-name";
            title.textContent = station.name;

            card.appendChild(img);
            card.appendChild(title);

            if (selectedType === "Todas") {
                const badge = document.createElement("span");
                badge.className = "station-badge";
                badge.textContent = station.type;
                card.appendChild(badge);
            }

            card.addEventListener("click", () => startStation(idx, 0));
            stationGrid.appendChild(card);
        });
    }

    function startStation(stationIdx, urlIdx) {
        const station = stations[stationIdx];
        if (!station || !station.urls || station.urls.length === 0) return;

        currentStationIndex = stationIdx;
        currentUrlIndex = urlIdx;

        currentLogoEl.src = station.logo || DEFAULT_LOGO;
        currentLogoEl.onerror = () => { currentLogoEl.src = DEFAULT_LOGO; };
        currentTitleEl.textContent = station.name;

        audio.src = station.urls[urlIdx];
        audio.play().catch(() => handleStreamError());
        renderGrid();
    }

    function playNextStation() {
        const list = getFilteredStationIndices();
        if (list.length === 0) return;
        const pos = list.indexOf(currentStationIndex);
        if (pos === -1) {
            startStation(list[0], 0);
        } else {
            const nextPos = (pos + 1) % list.length;
            startStation(list[nextPos], 0);
        }
    }

    function playPrevStation() {
        const list = getFilteredStationIndices();
        if (list.length === 0) return;
        const pos = list.indexOf(currentStationIndex);
        if (pos === -1) {
            startStation(list[list.length - 1], 0);
        } else {
            const prevPos = (pos - 1 + list.length) % list.length;
            startStation(list[prevPos], 0);
        }
    }

    function handleStreamError() {
        if (currentStationIndex === -1) return;
        const station = stations[currentStationIndex];
        if (station && currentUrlIndex + 1 < station.urls.length) {
            startStation(currentStationIndex, currentUrlIndex + 1);
        } else {
            isPlaying = false;
            updatePlayPauseIcon(false);
            playerDeck.classList.remove("playing");
        }
    }

    audio.addEventListener("playing", () => {
        isPlaying = true;
        updatePlayPauseIcon(true);
        playerDeck.classList.add("playing");
    });

    audio.addEventListener("pause", () => {
        isPlaying = false;
        updatePlayPauseIcon(false);
        playerDeck.classList.remove("playing");
    });

    audio.addEventListener("error", handleStreamError);

    playPauseBtn.addEventListener("click", () => {
        if (currentStationIndex === -1) {
            const list = getFilteredStationIndices();
            if (list.length > 0) startStation(list[0], 0);
            return;
        }
        if (isPlaying) {
            audio.pause();
        } else {
            audio.play().catch(() => handleStreamError());
        }
    });

    prevStationBtn.addEventListener("click", playPrevStation);
    nextStationBtn.addEventListener("click", playNextStation);

    /* Control de volumen */
    audio.volume = parseFloat(volumeSlider.value);
    volumeSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        audio.volume = val;
        volIcon.textContent = val === 0 ? "🔇" : val < 0.5 ? "🔉" : "🔊";
    });

    /* Cambio de tema */
    document.getElementById("themeBtn").addEventListener("click", () => {
        currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        applyTheme(currentThemeIndex);
    });

    /* Alternar vista añadir emisora */
    function showMainView() {
        addView.classList.add("view-hidden");
        mainView.classList.remove("view-hidden");
        toggleViewBtn.textContent = "➕";
        toggleViewBtn.title = "Añadir emisora";
    }

    function showAddView() {
        mainView.classList.add("view-hidden");
        addView.classList.remove("view-hidden");
        toggleViewBtn.textContent = "📻";
        toggleViewBtn.title = "Volver al reproductor";
    }

    toggleViewBtn.addEventListener("click", () => {
        if (addView.classList.contains("view-hidden")) {
            showAddView();
        } else {
            showMainView();
        }
    });

    document.getElementById("cancelAddBtn").addEventListener("click", showMainView);

    document.getElementById("saveStationBtn").addEventListener("click", () => {
        const name = document.getElementById("newName").value.trim();
        const type = document.getElementById("newType").value;
        const logo = document.getElementById("newLogo").value.trim() || DEFAULT_LOGO;
        const url1 = document.getElementById("newUrl1").value.trim();
        const url2 = document.getElementById("newUrl2").value.trim();

        if (!name || !url1) {
            alert("Por favor, introduce al menos el nombre y la URL principal.");
            return;
        }

        const urls = [url1];
        if (url2) urls.push(url2);

        stations.push({ name, type, logo, urls });
        localStorage.setItem("espencatStations", JSON.stringify(stations));

        document.getElementById("newName").value = "";
        document.getElementById("newType").value = "Música";
        document.getElementById("newLogo").value = "";
        document.getElementById("newUrl1").value = "";
        document.getElementById("newUrl2").value = "";

        renderFilters();
        renderGrid();
        showMainView();
    });

    renderFilters();
    renderGrid();
</script>
